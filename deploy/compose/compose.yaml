# Ops Sentinel platform: api + worker on one image, Exasol as the system of record.
#
#   cp ../../examples/sentinel.yaml ./sentinel.yaml      # edit: workspace, sources, channels, routes
#   cp ../../.env.example ./.env                         # fill in Exasol users (scripts/bootstrap_sentinel_roles.py)
#   docker compose up -d                                 # api migrates the schema and installs UDFs on start
#   docker compose --profile exasol up -d                # same, plus a local Exasol (needs privileged mode)
#
# Scale workers with `docker compose up -d --scale worker=3`; the Exasol job queue makes that safe.
name: ops-sentinel

x-engine: &engine
  image: ${OPS_SENTINEL_IMAGE:-ops-sentinel:latest}
  build: ../..
  env_file: .env
  environment:
    OPS_SENTINEL_SPEC_FILE: /app/config/sentinel.yaml
  volumes:
    - ./sentinel.yaml:/app/config/sentinel.yaml:ro
    - ./business-context.md:/app/context/business-context.md:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  api:
    <<: *engine
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  worker:
    <<: *engine
    command: ["sentinel-worker"]
    depends_on:
      api:
        condition: service_healthy   # the api applies migrations before any worker claims a job

  # Optional local Exasol for a laptop setup. Point EXASOL_ADMIN_HOST at "exasol" in .env when you use it.
  exasol:
    image: exasol/docker-db:latest
    profiles: ["exasol"]
    privileged: true
    ports:
      - "127.0.0.1:8563:8563"
    volumes:
      - exasol-data:/exa
    restart: unless-stopped

volumes:
  exasol-data:

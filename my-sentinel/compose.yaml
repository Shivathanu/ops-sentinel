# Local project stack. Run from this directory: docker compose up -d --build
# The engine source is the sibling engine/ directory. Exasol stays on the host (exakit).
name: ops-sentinel

x-engine: &engine
  image: ${OPS_SENTINEL_IMAGE:-ops-sentinel:latest}
  env_file: .env
  environment:
    OPS_SENTINEL_SPEC_FILE: /app/config/sentinel.yaml
  volumes:
    - ./sentinel.yaml:/app/config/sentinel.yaml:ro
    - ./business-context.md:/app/context/business-context.md:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]

services:
  api:
    <<: *engine
    build: ../engine
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5

  worker:
    <<: *engine
    command: ["sentinel-worker"]
    healthcheck:
      test: ["CMD", "sentinel-worker", "--check"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      api:
        condition: service_healthy

# Minimal workspace. Add a Slack channel when SLACK_BOT_TOKEN and SLACK_CHANNEL_ID are set.
apiVersion: sentinel/v1
workspace: demo
sources:
  - name: prometheus
    type: alertmanager
    token: ${env:AM_INGEST_TOKEN}
  - name: jobs
    type: webhook
channels:
  oncall:
    type: slack
    token: ${env:SLACK_BOT_TOKEN}
    channel: ${env:SLACK_CHANNEL_ID}
    interactive: true
routes:
  - default:
      notify: [oncall]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-sentinel"
dynamic = ["version"]
description = "Cost-aware ops manager: detects pipeline failures and query-cost spikes in Exasol, investigates over MCP, and remediates only after human approval."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Shiva" }]
keywords = ["exasol", "mcp", "dataops", "incident-response", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic-settings==2.6.*",
    "httpx==0.27.*",
    "pyexasol==0.27.*",
    "mcp==1.*",
    "slack_sdk==3.33.*",
    "python-dotenv==1.0.*",
    "openai==1.*",
    "anthropic<1",
    "pyyaml>=6.0,<7",
]

[project.scripts]
sentinel-migrate = "sentinel.store.migrate:main"
sentinel-worker = "sentinel.workers.worker:main"
sentinel-validate = "sentinel.core.validate:main"

[project.optional-dependencies]
dashboard = [
    # 1.59.1 is the newest 3.10-compatible release whose Pillow and PyArrow
    # ranges still resolve to binary wheels on Python 3.15. 1.39 requires
    # Pillow<11, which has no 3.15 wheel and fails to compile without libjpeg.
    "streamlit==1.59.1",
    "pandas==2.2.*",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "sentinel.__version__" }

[tool.setuptools.packages.find]
# Flat layout: only the sentinel package ships; tests, scripts, cli and the dashboard stay out of the wheel.
where = ["."]
include = ["sentinel*"]

[tool.setuptools.package-data]
sentinel = ["py.typed", "store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long SQL and prompt string literals are kept readable as written rather than wrapped.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Scripts configure stdout and load .env before importing the package.
"scripts/*" = ["E402"]
